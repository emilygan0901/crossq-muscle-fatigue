# PILOT (not a reported result): is Hand Reach learnable within 500k steps, is there room for
# SAC and CrossQ to differ, and does fatigue drift change performance? 1 seed. Also measures run time.
# Algorithm: SAC (authors' baseline settings, as in configs/repro/walker2d_sac.cfg).
# FATIGUE DRIFT: episodes start with a fatigued fraction rising linearly from 0 to 0.6 over training (0 -> 500k steps).
# Code: authors' CrossQ (commit a318a26) + patches/crossq_coursework.patch; fatigue model: src/fatigue_drift.py

NAME=pilot_handreach_sac_drift
CODE_DIR=${CODE_DIR_DEV:-/kaggle/working/CrossQ-dev}   # authors' code + coursework patch
PYTHON=${PYTHON_DEV:-/kaggle/working/env-dev/bin/python}  # MyoSuite 2.8.4, MuJoCo 3.1.2

ENV_ID=myoFatiHandReachRandomDrift-v0
TOTAL_STEPS=500000
LOG_FREQ=1000     # evaluate every 5,000,000 / 1000 = 5,000 env steps

# Read by our code: 10 evaluation episodes (random targets), and the fatigue schedule.
ENV_VARS="N_EVAL_EPISODES=10 FATIGUE_MAX=0.6 FATIGUE_RAMP_START=0 FATIGUE_RAMP_STEPS=500000"

TRAIN_ARGS="-algo sac -critic_activation relu -lr 0.001 -utd 1 -policy_delay 1 -adam_b1 0.9 -crossq_style 0 -bn 0 -ln 0 -n_critics 2 -n_neurons 256 -bn_mode brn_actor -bn_momentum 0.99 -eval_qbias 0"
