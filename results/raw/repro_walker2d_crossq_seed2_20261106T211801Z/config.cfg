# Reproduction of Bhatt et al. (ICLR 2024), Figure 5, Walker2d panel: CrossQ.
# Hyperparameters copied from the authors' slurm/submit_everything.sh,
# "Main Plots (Fig 1,3,5)" block, ALGO='sac' line with BN=1 for Walker2d (commit a318a26).
# The authors launch CrossQ as "-algo sac" with every setting explicit; we do the same.
# Scaled down: 500,000 instead of 5,000,000 environment steps; 5 seeds instead of 10.

NAME=repro_walker2d_crossq
CODE_DIR=${CODE_DIR_REPRO:-/kaggle/working/CrossQ-baseline}   # authors' code, unmodified
PYTHON=${PYTHON_REPRO:-/kaggle/working/env-repro/bin/python}  # authors' pinned versions

ENV_ID=Walker2d-v4
TOTAL_STEPS=500000
# train.py evaluates every 5,000,000 / LOG_FREQ env steps -> every 5,000 steps.
# Evaluation itself is unmodified: 1 deterministic episode, as in the paper.
LOG_FREQ=1000

TRAIN_ARGS="-algo sac -critic_activation relu -lr 0.001 -utd 1 -policy_delay 3 -adam_b1 0.5 -crossq_style 1 -bn 1 -ln 0 -n_critics 2 -n_neurons 2048 -bn_mode brn_actor -bn_momentum 0.99 -eval_qbias 0"
