# MAIN EXPERIMENT (Amendment 3, H6/H7): CrossQ without batch normalisation, with a target network (Amendment 3).
# Identical to the CrossQ config except -crossq_style 0 -bn 0: Batch Renormalization removed, and the
# SAC target network restored (tau = 0.005, set by train.py when crossq_style is 0; no joint forward
# pass). Same critic width (2048), policy delay (3), Adam beta1 (0.5) and learning rate as CrossQ, so the
# variant differs from CrossQ only in its stabiliser: batch statistics vs a target network.
# Condition: CONTROL: fixed fatigue, level 0.5 in every episode from the first step (stationary, equally hard as the end of drift).
# Code: authors' CrossQ (commit a318a26) + patches/crossq_coursework.patch; fatigue: src/fatigue_drift.py

NAME=main_handreach_crossqnobn_fixed
CODE_DIR=${CODE_DIR_DEV:-/kaggle/working/CrossQ-dev}   # authors' code + coursework patch
PYTHON=${PYTHON_DEV:-/kaggle/working/env-dev/bin/python}  # MyoSuite 2.8.4, MuJoCo 3.1.2

ENV_ID=myoFatiHandReachRandomDrift-v0
TOTAL_STEPS=500000
LOG_FREQ=1000     # evaluate every 5,000,000 / 1000 = 5,000 env steps

# Read by our code: 10 evaluation episodes (random targets), and the fatigue schedule.
ENV_VARS="N_EVAL_EPISODES=10 FATIGUE_FIXED=0.5"

TRAIN_ARGS="-algo sac -critic_activation relu -lr 0.001 -utd 1 -policy_delay 3 -adam_b1 0.5 -crossq_style 0 -bn 0 -ln 0 -n_critics 2 -n_neurons 2048 -bn_mode brn_actor -bn_momentum 0.99 -eval_qbias 0"
