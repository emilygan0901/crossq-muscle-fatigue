# MAIN EXPERIMENT (see HYPOTHESIS.md). Hand Reach, 500k steps, seeds 11-15 (paired across conditions).
# Algorithm: SAC (authors' baseline settings, as in configs/repro/walker2d_sac.cfg)
# Condition: SUDDEN (Amendment 2): full strength (level 0) for steps 0-250k, then level 0.5 from step 250k to 500k.
# Fatigue level 0.5 = 50% loss of maximal force capacity in MyoSuite's 3CC-r model; upper end of the
# 30-50% loss reported for a 60-s maximal contraction of a hand muscle (Bigland-Ritchie et al., 1983).
# All conditions use the same Drift task, so MyoSuite's fatigue activation dynamics are identical.
# Code: authors' CrossQ (commit a318a26) + patches/crossq_coursework.patch; fatigue: src/fatigue_drift.py

NAME=main_handreach_sac_sudden
CODE_DIR=${CODE_DIR_DEV:-/kaggle/working/CrossQ-dev}   # authors' code + coursework patch
PYTHON=${PYTHON_DEV:-/kaggle/working/env-dev/bin/python}  # MyoSuite 2.8.4, MuJoCo 3.1.2

ENV_ID=myoFatiHandReachRandomDrift-v0
TOTAL_STEPS=500000
LOG_FREQ=1000     # evaluate every 5,000,000 / 1000 = 5,000 env steps

# Read by our code: 10 evaluation episodes (random targets), and the fatigue schedule.
ENV_VARS="N_EVAL_EPISODES=10 FATIGUE_MAX=0.5 FATIGUE_RAMP_START=250000 FATIGUE_RAMP_STEPS=1"

TRAIN_ARGS="-algo sac -critic_activation relu -lr 0.001 -utd 1 -policy_delay 1 -adam_b1 0.9 -crossq_style 0 -bn 0 -ln 0 -n_critics 2 -n_neurons 256 -bn_mode brn_actor -bn_momentum 0.99 -eval_qbias 0"
