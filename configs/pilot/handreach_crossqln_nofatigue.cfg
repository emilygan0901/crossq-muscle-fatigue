# PILOT (not a reported result): can CrossQ learn Hand Reach with LayerNorm instead of Batch
# Renormalization? Decides whether H3 (BatchNorm vs LayerNorm under fixed and drift) is feasible.
# Identical to configs/main/handreach_crossq_nofatigue.cfg except -bn 0 -ln 1 (no target network,
# same critic width, policy delay and Adam settings). Note: in the authors' code LayerNorm is applied
# after the critic's hidden layers only; with -bn 0 there is no input normalisation and no
# normalisation in the actor. No fatigue, seed 1.
# Code: authors' CrossQ (commit a318a26) + patches/crossq_coursework.patch; fatigue: src/fatigue_drift.py

NAME=pilot_handreach_crossqln_nofatigue
CODE_DIR=${CODE_DIR_DEV:-/kaggle/working/CrossQ-dev}   # authors' code + coursework patch
PYTHON=${PYTHON_DEV:-/kaggle/working/env-dev/bin/python}  # MyoSuite 2.8.4, MuJoCo 3.1.2

ENV_ID=myoFatiHandReachRandomDrift-v0
TOTAL_STEPS=500000
LOG_FREQ=1000     # evaluate every 5,000,000 / 1000 = 5,000 env steps

# Read by our code: 10 evaluation episodes (random targets), and the fatigue schedule.
ENV_VARS="N_EVAL_EPISODES=10 FATIGUE_MAX=0.0"

TRAIN_ARGS="-algo sac -critic_activation relu -lr 0.001 -utd 1 -policy_delay 3 -adam_b1 0.5 -crossq_style 1 -bn 0 -ln 1 -n_critics 2 -n_neurons 2048 -bn_mode brn_actor -bn_momentum 0.99 -eval_qbias 0"
