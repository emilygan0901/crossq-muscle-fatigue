# BRIDGE: the Walker2d reproduction config, run in the MyoSuite software setup (MuJoCo 3.1.2,
# authors' code + coursework patch) to check that the software change and the patch do not change
# the CrossQ vs SAC pattern. Settings identical to configs/repro/walker2d_crossq.cfg (1 evaluation
# episode, as in the paper; N_EVAL_EPISODES is not set). Not a reproduction result.


NAME=bridge_walker2d_crossq
CODE_DIR=${CODE_DIR_DEV:-/kaggle/working/CrossQ-dev}   # authors' code + coursework patch
PYTHON=${PYTHON_DEV:-/kaggle/working/env-dev/bin/python}  # MyoSuite environment: MuJoCo 3.1.2

ENV_ID=Walker2d-v4
TOTAL_STEPS=500000
# train.py evaluates every 5,000,000 / LOG_FREQ env steps -> every 5,000 steps.
# Evaluation itself is unmodified: 1 deterministic episode, as in the paper.
LOG_FREQ=1000

TRAIN_ARGS="-algo sac -critic_activation relu -lr 0.001 -utd 1 -policy_delay 3 -adam_b1 0.5 -crossq_style 1 -bn 1 -ln 0 -n_critics 2 -n_neurons 2048 -bn_mode brn_actor -bn_momentum 0.99 -eval_qbias 0"
